<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#059669"><meta name="description" content="Lista de la compra sencilla, privada y disponible sin conexión."><title>Mi lista de la compra</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1e293b;background:#f1f5f9;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:0 0 calc(92px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}.top{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;padding:12px 16px;box-shadow:0 2px 8px #0f172a0a}.wrap{max-width:620px;margin:auto}.toprow{display:flex;align-items:center;gap:10px}.brand{font-size:25px}.top h1{font-size:19px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top select{max-width:48%;padding:8px;border:1px solid #cbd5e1;border-radius:10px;background:white;font-weight:600;color:#334155}.progress{height:10px;border-radius:20px;background:#e2e8f0;margin-top:12px;overflow:hidden}.progress>div{height:100%;width:0;background:#059669;transition:width .2s}.meta{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-top:5px}main{max-width:620px;margin:auto;padding:16px}.cat{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:13px;box-shadow:0 2px 5px #0f172a08}.cathead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f1f5f9;padding-bottom:8px;margin-bottom:3px}.cathead h2{font-size:14px;margin:0}.cathead small{color:#94a3b8}.item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #f1f5f9}.item:last-child{border:0}.item input{width:21px;height:21px;accent-color:#059669;flex-shrink:0}.itemtext{flex:1;min-width:0}.itemtitle{font-size:14px;font-weight:550;overflow-wrap:anywhere}.itemdesc{font-size:12px;color:#94a3b8;margin-top:2px}.done .itemtitle{text-decoration:line-through;color:#9ca3af}.iconbtn{border:0;background:transparent;color:#94a3b8;padding:8px;font-size:17px;cursor:pointer}.empty{text-align:center;padding:38px 12px;color:#64748b;background:white;border-radius:16px;border:1px dashed #cbd5e1}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #e2e8f0;padding:11px 14px calc(11px + env(safe-area-inset-bottom))}.actions{display:flex;gap:8px;max-width:620px;margin:auto}.btn{border:0;border-radius:12px;padding:12px 13px;font-weight:650;font-size:13px;cursor:pointer}.btn.primary{background:#059669;color:white;flex:1}.btn.light{background:#e2e8f0;color:#334155}.btn.danger{background:#fff1f2;color:#be123c}.btn.full{width:100%}.modal{position:fixed;inset:0;z-index:10;background:#0f172a99;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.panel{background:white;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px;padding:18px;box-shadow:0 20px 60px #0003}.panel h2{font-size:18px;margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;font:inherit;background:white}.row{display:flex;gap:8px}.row>*{flex:1}.panelactions{display:flex;gap:8px;margin-top:18px}.panelactions>*{flex:1}.catmanage{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#f8fafc;border-radius:8px;margin:5px 0;font-size:13px}.tools{border-top:1px solid #e2e8f0;margin-top:16px;padding-top:12px}.hint{font-size:12px;color:#64748b;line-height:1.45}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);z-index:20;background:#0f172a;color:white;padding:9px 15px;border-radius:30px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.hidden{display:none!important}@media(min-width:600px){.modal{align-items:center}.top select{max-width:230px}}
</style></head><body>
<header class="top"><div class="wrap"><div class="toprow"><span class="brand">🛒</span><h1 id="heading">Mi lista de la compra</h1><select id="listSelect" aria-label="Seleccionar lista"></select><button class="iconbtn" onclick="openSettings()" aria-label="Configuración">⚙️</button></div><div class="progress"><div id="progressBar"></div></div><div class="meta"><span id="progressText">0 de 0 comprados (0%)</span><span id="progressStatus">Vacía</span></div></div></header>
<main id="content"></main><footer class="bottom"><div class="actions"><button class="btn light" onclick="uncheckAll()">↶ Reset casillas</button><button class="btn primary" onclick="openAdd()">＋ Añadir producto</button></div></footer>
<div class="modal" id="productModal"><section class="panel"><h2 id="productModalTitle">Añadir producto</h2><form id="productForm"><div class="field"><label for="productName">Nombre *</label><input id="productName" required maxlength="120" placeholder="Ej. Leche"></div><div class="field"><label for="productDesc">Detalle / cantidad</label><input id="productDesc" maxlength="180" placeholder="Ej. 2 litros"></div><div class="field"><label for="productCat">Categoría</label><select id="productCat"></select></div><div class="panelactions"><button type="button" class="btn light" onclick="closeModal('productModal')">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form></section></div>
<div class="modal" id="settingsModal"><section class="panel"><h2>⚙️ Configuración</h2><div class="field"><label for="listTitle">Nombre de la lista actual</label><div class="row"><input id="listTitle" maxlength="60"><button class="btn light" onclick="renameList()">Guardar</button></div></div><div class="field"><label>Mis listas</label><div class="row"><button class="btn light" onclick="createList()">＋ Nueva</button><button class="btn light" onclick="duplicateList()">▣ Duplicar</button><button class="btn danger" onclick="deleteList()">Eliminar</button></div></div><div class="field"><label>Nueva categoría</label><div class="row"><input id="newCategory" maxlength="60" placeholder="Ej. Congelados"><button class="btn light" onclick="addCategory()">Crear</button></div><div id="categoryList"></div></div><div class="tools"><label class="field"><span style="font-size:12px;font-weight:700">COPIA DE SEGURIDAD</span></label><p class="hint">Exporta todas tus listas a un archivo JSON para guardarlas o trasladarlas a otro dispositivo. La importación sustituye las listas actuales.</p><div class="row"><button class="btn light" onclick="exportBackup()">⬇ Exportar</button><button class="btn light" onclick="document.getElementById('importFile').click()">⬆ Importar</button><input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importBackup(event)"></div></div><div class="panelactions"><button class="btn primary full" onclick="closeModal('settingsModal')">Cerrar</button></div></section></div><div class="toast" id="toast"></div>
<script>
'use strict';
// Espacio de almacenamiento nuevo y exclusivo de esta PWA. No lee ni migra claves de versiones HTML anteriores.
const STORAGE_KEY='compra_pwa_data_v1';
const starterCategories=['Fruta y verdura','Carnicería y pescadería','Lácteos y refrigerados','Despensa','Panadería','Otros'];
let state, activeProductId=null;
const uid=()=> 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
function freshList(name='Mi lista de la compra'){return {id:uid(),name,categories:[...starterCategories],items:[]}}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);state=raw?JSON.parse(raw):{version:1,activeId:null,lists:[]};if(!state||!Array.isArray(state.lists)||!state.lists.length)state={version:1,activeId:null,lists:[freshList()]};if(!state.lists.some(x=>x.id===state.activeId))state.activeId=state.lists[0].id;save()}catch(e){state={version:1,activeId:null,lists:[freshList()]};state.activeId=state.lists[0].id;save()}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function current(){return state.lists.find(x=>x.id===state.activeId)||state.lists[0]}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const l=current();document.title=l.name;document.getElementById('heading').textContent=l.name;const sel=document.getElementById('listSelect');sel.innerHTML=state.lists.map(x=>`<option value="${safe(x.id)}" ${x.id===l.id?'selected':''}>${safe(x.name)}</option>`).join('');const cats=document.getElementById('content');cats.innerHTML='';if(!l.categories.length){cats.innerHTML='<div class="empty">No hay categorías. Añade una desde ⚙️.</div>'}else{l.categories.forEach(cat=>{const items=l.items.filter(x=>x.cat===cat);const el=document.createElement('section');el.className='cat';el.innerHTML=`<div class="cathead"><h2>${safe(cat)}</h2><small>${items.filter(x=>x.checked).length}/${items.length}</small></div>`+(items.length?items.map(x=>`<div class="item ${x.checked?'done':''}"><input type="checkbox" ${x.checked?'checked':''} aria-label="Marcar ${safe(x.title)}" onchange="toggleItem('${safe(x.id)}')"><div class="itemtext"><div class="itemtitle">${safe(x.title)}</div>${x.desc?`<div class="itemdesc">${safe(x.desc)}</div>`:''}</div><button class="iconbtn" onclick="editItem('${safe(x.id)}')" aria-label="Editar">✎</button><button class="iconbtn" onclick="deleteItem('${safe(x.id)}')" aria-label="Eliminar">×</button></div>`).join(''):'<div class="hint" style="text-align:center;padding:10px">Sin productos</div>');cats.appendChild(el)})}const total=l.items.length,done=l.items.filter(x=>x.checked).length,p=total?Math.round(done/total*100):0;document.getElementById('progressBar').style.width=p+'%';document.getElementById('progressText').textContent=`${done} de ${total} comprados (${p}%)`;document.getElementById('progressStatus').textContent=total?(p===100?'¡Completado! 🎉':p+'%'):'Vacía';populateCategorySelect()}
function populateCategorySelect(){document.getElementById('productCat').innerHTML=current().categories.map(c=>`<option value="${safe(c)}">${safe(c)}</option>`).join('')}
document.getElementById('listSelect').addEventListener('change',e=>{state.activeId=e.target.value;save();render()});
function openModal(id){document.getElementById(id).classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function openAdd(){if(!current().categories.length){toast('Crea primero una categoría');return}activeProductId=null;document.getElementById('productModalTitle').textContent='Añadir producto';document.getElementById('productForm').reset();populateCategorySelect();openModal('productModal');setTimeout(()=>document.getElementById('productName').focus(),100)}
function editItem(id){const x=current().items.find(i=>i.id===id);if(!x)return;activeProductId=id;document.getElementById('productModalTitle').textContent='Editar producto';document.getElementById('productName').value=x.title;document.getElementById('productDesc').value=x.desc||'';populateCategorySelect();document.getElementById('productCat').value=x.cat;openModal('productModal')}
document.getElementById('productForm').addEventListener('submit',e=>{e.preventDefault();const l=current(),title=document.getElementById('productName').value.trim(),desc=document.getElementById('productDesc').value.trim(),cat=document.getElementById('productCat').value;if(!title||!cat)return;if(activeProductId){const x=l.items.find(i=>i.id===activeProductId);if(x)Object.assign(x,{title,desc,cat})}else l.items.push({id:uid(),title,desc,cat,checked:false});save();render();closeModal('productModal');toast(activeProductId?'Producto actualizado':'Producto añadido')});
function toggleItem(id){const x=current().items.find(i=>i.id===id);if(x){x.checked=!x.checked;save();render()}}
function deleteItem(id){if(!confirm('¿Eliminar este producto?'))return;current().items=current().items.filter(x=>x.id!==id);save();render();toast('Producto eliminado')}
function uncheckAll(){current().items.forEach(x=>x.checked=false);save();render();toast('Casillas desmarcadas')}
function openSettings(){const l=current();document.getElementById('listTitle').value=l.name;renderCategories();openModal('settingsModal')}
function renameList(){const v=document.getElementById('listTitle').value.trim();if(!v)return;current().name=v;save();render();toast('Lista renombrada')}
function createList(){const name=prompt('Nombre de la nueva lista:','Nueva lista');if(name===null)return;const l=freshList(name.trim()||'Nueva lista');state.lists.push(l);state.activeId=l.id;save();render();openSettings();toast('Lista creada')}
function duplicateList(){const l=current(),name=prompt('Nombre de la copia:',l.name+' (copia)');if(name===null)return;const copy=JSON.parse(JSON.stringify(l));copy.id=uid();copy.name=name.trim()||l.name+' (copia)';copy.items=copy.items.map(x=>({...x,id:uid()}));state.lists.push(copy);state.activeId=copy.id;save();render();openSettings();toast('Lista duplicada')}
function deleteList(){if(state.lists.length===1){alert('Debe quedar al menos una lista. Puedes vaciar sus productos.');return}if(!confirm(`¿Eliminar la lista «${current().name}» y todos sus productos?`))return;state.lists=state.lists.filter(x=>x.id!==state.activeId);state.activeId=state.lists[0].id;save();render();openSettings();toast('Lista eliminada')}
function addCategory(){const input=document.getElementById('newCategory'),v=input.value.trim(),l=current();if(!v)return;if(l.categories.includes(v)){toast('Esa categoría ya existe');return}l.categories.push(v);input.value='';save();render();renderCategories();toast('Categoría creada')}
function removeCategory(cat){const l=current(),n=l.items.filter(x=>x.cat===cat).length;if(!confirm(`¿Eliminar «${cat}»${n?' y sus '+n+' productos':''}?`))return;l.categories=l.categories.filter(x=>x!==cat);l.items=l.items.filter(x=>x.cat!==cat);save();render();renderCategories()}
function renderCategories(){document.getElementById('categoryList').innerHTML=current().categories.map(c=>`<div class="catmanage"><span>${safe(c)}</span><button class="iconbtn" data-cat="${safe(c)}" onclick="removeCategory(this.dataset.cat)" aria-label="Eliminar categoría">×</button></div>`).join('')||'<p class="hint">No hay categorías.</p>'}
function exportBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mis-listas-de-compra.json';a.click();URL.revokeObjectURL(url);toast('Copia de seguridad exportada')}
function importBackup(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d||!Array.isArray(d.lists)||!d.lists.length||!d.lists.every(l=>Array.isArray(l.categories)&&Array.isArray(l.items)))throw Error('Formato no válido');if(!confirm('La importación sustituirá todas las listas actuales. ¿Continuar?'))return;state={version:1,activeId:d.activeId,lists:d.lists.map(l=>({id:String(l.id||uid()),name:String(l.name||'Lista'),categories:l.categories.map(String),items:l.items.map(x=>({id:String(x.id||uid()),title:String(x.title||''),desc:String(x.desc||''),cat:String(x.cat||''),checked:!!x.checked}))}))};if(!state.lists.some(l=>l.id===state.activeId))state.activeId=state.lists[0].id;save();render();closeModal('settingsModal');toast('Copia restaurada')}catch(err){alert('No se pudo importar el archivo. Comprueba que sea una copia válida de esta aplicación.')}finally{e.target.value=''}};reader.readAsText(f)}
load();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
